<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Fundamentals Course</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'space-grotesk': ['"Space Grotesk"', 'sans-serif'],
            'inter': ['Inter', 'sans-serif'],
          },
          colors: {
            bgDark: '#0B0F19',
            accent: '#10B981',
            textMuted: '#94A3B8',
            cardBg: '#151B2B'
          }
        }
      }
    }
  </script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body class="bg-bgDark text-white font-inter min-h-screen flex items-center justify-center p-4">

  <!-- Main Container -->
  <main class="w-full flex items-center justify-center">

    <!-- Card -->
    <article
      class="card-container w-full max-w-[90vw] lg:max-w-[90vw] bg-cardBg border border-white/5 rounded-3xl overflow-hidden shadow-2xl opacity-0 translate-y-8">

      <!-- Image: Fit, No Cropping -->
      <div class="w-full bg-white/5 flex items-center justify-center p-8">
        <img src="img/HTML-Certificate.png" alt="Offer Visual"
          class="w-full h-auto object-contain max-h-[60vh]">
      </div>

      <!-- Content -->
      <div class="p-8 md:p-12 text-center">
        <h1 class="font-space-grotesk text-3xl md:text-5xl font-bold text-white mb-6">
          Completed HTML Fundamentals
        </h1>
        <p class="font-inter text-lg md:text-xl text-textMuted leading-relaxed max-w-2xl mx-auto">
          Certificate of completion in honor of completing the HTML Fundamentals Course on Codeliber 'LEARN HTML' app.
        </p>

        <div class="flex gap-5 justify-center">
          <div class="mt-10">
            <a href="css-codeliber.html"
              class="inline-block px-10 py-4 bg-accent text-bgDark font-bold rounded-full hover:bg-accent/90 transition-all">
              View CSS Certificate
            </a>
          </div>

          <div class="mt-10">
            <a href="../index.html"
              class="inline-block px-10 py-4 bg-accent text-bgDark font-bold rounded-full hover:bg-accent/90 transition-all">
              Back to Portfolio
            </a>
          </div>
        </div>
      </div>
    </article>

  </main>

  <script>
    // Simple Entrance Animation
    gsap.to(".card-container", {
      duration: 0.8,
      opacity: 1,
      y: 0,
      ease: "power3.out",
      delay: 0.2
    });
  </script>

</body>

</html>
